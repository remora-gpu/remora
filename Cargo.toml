[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/remora-gpu/remora"
homepage = "https://remora-gpu.github.io/remora/"
authors = ["Remora contributors"]
publish = false

[workspace.dependencies]
remora-proto = { path = "crates/remora-proto" }
remora-transport = { path = "crates/remora-transport" }
remora-codegen = { path = "crates/remora-codegen" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.dist]
inherits = "release"
lto = "fat"
strip = "symbols"
